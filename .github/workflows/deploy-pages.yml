name: Deploy P × N Afterhours

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract latest website package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site _unpacked

          archive="$(find . -maxdepth 1 -type f -name 'Piyush-Nainsi-Afterhours-V*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$archive"

          echo "Deploying: $archive"
          unzip -q "$archive" -d _unpacked

          index_path="$(find _unpacked -type f -name index.html -print -quit)"
          test -n "$index_path"

          site_root="$(dirname "$index_path")"
          cp -a "$site_root"/. _site/
          test -f _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
